name: Deploy to AWS (S3 + CloudFront)

# Manual only, for now — trigger from the Actions tab when you're ready to publish.
# Requires these repo secrets to be set (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              e.g. us-east-1
#   AWS_S3_BUCKET           e.g. pf2e-remastered-site
#   AWS_CLOUDFRONT_DIST_ID  the CloudFront distribution ID in front of the bucket
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync _site "s3://${{ secrets.AWS_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.AWS_CLOUDFRONT_DIST_ID }}" --paths "/*"
